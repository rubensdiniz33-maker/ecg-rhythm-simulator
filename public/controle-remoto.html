<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#04080a"><title>Controle remoto · ECG Rhythm Simulator</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#04080a;color:#d4e6e0}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at top,#0e171b,#04080a 65%);padding:18px 14px 28px}.wrap{max-width:520px;margin:0 auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px}.eyebrow{font-size:10px;letter-spacing:.2em;color:#86a19b;font-weight:700}.title{font-size:22px;font-weight:750;margin:5px 0 0}.status{font-size:12px;color:#fbbf24;padding:7px 10px;border:1px solid #4a3c17;border-radius:999px;white-space:nowrap}.card{border:1px solid #172329;background:#090f12;border-radius:14px;padding:16px;margin:12px 0}.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#86a19b;font-weight:700;margin-bottom:11px}.bigbtn{width:100%;min-height:52px;border:1px solid #22333b;border-radius:10px;background:#0e171b;color:#d4e6e0;font-size:15px;font-weight:650;touch-action:manipulation}.bigbtn.primary{background:#12221b;border-color:#1f6f43;color:#4ade80}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.seg{display:flex;gap:7px}.seg button{flex:1;min-height:42px;border:1px solid #22333b;border-radius:8px;background:#04080a;color:#86a19b;font-size:14px}.seg button.active{border-color:#1f6f43;background:#12221b;color:#4ade80;font-weight:700}select{width:100%;min-height:46px;border:1px solid #22333b;border-radius:8px;background:#04080a;color:#d4e6e0;padding:0 10px;font-size:14px}.sub{font-size:12px;color:#6d8881;line-height:1.5;margin-top:9px}.danger{border-color:#5b3030;color:#f87171;background:#1a0d0d}.footer{text-align:center;color:#4c625d;font-size:11px;margin:20px 8px 0}button:disabled,select:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body><main class="wrap">
<header class="top"><div><div class="eyebrow">BEIRA DO MONITOR</div><h1 class="title">Controle remoto ECG</h1></div><div id="status" class="status">Conectando…</div></header>
<section class="card"><div class="label">Ritmo cardíaco</div><select id="rhythm" disabled><option>Aguardando simulador…</option></select><div class="grid" style="margin-top:10px"><button id="random" class="bigbtn" disabled>Ritmo aleatório</button><button id="clear" class="bigbtn" disabled>Limpar traçado</button></div></section>
<section class="card"><div class="label">Simulação</div><div class="grid"><button id="run" class="bigbtn primary" disabled>Conectar…</button><button id="freeze" class="bigbtn" disabled>Congelar</button></div><p class="sub" id="current">Os comandos enviados aqui atualizam o monitor principal e a projeção.</p></section>
<section class="card"><div class="label">Velocidade · mm/s</div><div class="seg"><button data-speed="25" disabled>25</button><button data-speed="50" disabled>50</button></div></section>
<section class="card"><div class="label">Amplitude · mm/mV</div><div class="seg"><button data-gain="5" disabled>5</button><button data-gain="10" disabled>10</button><button data-gain="20" disabled>20</button></div></section>
<p class="footer">Este controle não exibe o ECG. Deixe o simulador aberto no computador.</p>
</main>
<script>
(()=>{const params=new URLSearchParams(location.search),host=params.get("host"),status=document.getElementById("status");let peer=null,conn=null,state=null;const controls=[...document.querySelectorAll("button,select")];function enable(on){controls.forEach(x=>x.disabled=!on)}function command(action,extra={}){if(conn&&conn.open)conn.send({type:"command",action,...extra})}function render(s){state=s;document.getElementById("run").textContent=s.running?"Pausar":"Continuar";document.getElementById("freeze").textContent=s.frozen?"Descongelar":"Congelar";document.querySelectorAll("[data-speed]").forEach(b=>b.classList.toggle("active",Number(b.dataset.speed)===s.speed));document.querySelectorAll("[data-gain]").forEach(b=>b.classList.toggle("active",Number(b.dataset.gain)===s.gain));const select=document.getElementById("rhythm");if(s.rhythms&&select.options.length!==s.rhythms.length){select.innerHTML="";s.rhythms.forEach(r=>{const o=document.createElement("option");o.value=r.id;o.textContent=r.name;select.appendChild(o)})}if(s.rhythmId)select.value=s.rhythmId;document.getElementById("current").textContent="Ritmo atual: "+(s.rhythmName||"não identificado")+". Alterações sincronizadas com o monitor principal.";enable(true)}if(!host||!window.Peer){status.textContent="Link inválido";document.getElementById("current").textContent="Abra novamente pelo QR Code exibido no simulador.";return}peer=new Peer();peer.on("open",()=>{conn=peer.connect(host,{reliable:true});conn.on("open",()=>{status.textContent="Conectado";status.style.color="#4ade80";status.style.borderColor="#1f6f43"});conn.on("data",d=>{if(d&&d.type==="state")render(d.state)});conn.on("close",()=>{status.textContent="Desconectado";status.style.color="#fbbf24";enable(false)})});peer.on("error",()=>{status.textContent="Falha na conexão";enable(false)});document.getElementById("run").addEventListener("click",()=>command("toggleRun"));document.getElementById("freeze").addEventListener("click",()=>command("toggleFreeze"));document.getElementById("random").addEventListener("click",()=>command("random"));document.getElementById("clear").addEventListener("click",()=>command("clear"));document.getElementById("rhythm").addEventListener("change",e=>command("rhythm",{id:e.target.value}));document.querySelectorAll("[data-speed]").forEach(b=>b.addEventListener("click",()=>command("speed",{value:Number(b.dataset.speed)})));document.querySelectorAll("[data-gain]").forEach(b=>b.addEventListener("click",()=>command("gain",{value:Number(b.dataset.gain)})));window.addEventListener("pagehide",()=>{try{conn&&conn.close();peer&&peer.destroy()}catch(_){}});
})();
</script></body></html>
