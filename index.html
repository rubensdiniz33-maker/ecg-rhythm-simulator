<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Simulador de ECG</title></head>
<body><p style="font:16px system-ui;padding:24px">Carregando simulador de ECG…</p><script>
(async()=>{const files=["ecg-html-part-01.txt","ecg-html-part-02.txt","ecg-html-part-03.txt","ecg-html-part-04.txt","ecg-html-part-05.txt","ecg-html-part-06.txt","ecg-html-part-07.txt","ecg-html-part-08.txt"];const parts=await Promise.all(files.map(async f=>{const r=await fetch('/'+f);if(!r.ok)throw new Error('Falha ao carregar '+f);return r.text()}));document.open();document.write(parts.join(''));document.close()})().catch(e=>{document.body.textContent='Não foi possível carregar o simulador de ECG: '+e.message});
</script></body></html>
